repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
    - id: ruff-check
      args: [--fix, --extend-select=I]
    - id: ruff-format
- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.14.1-1
  hooks:
    - id: shfmt
- repo: https://github.com/bnjbvr/cargo-machete
  rev: v0.9.2
  hooks:
    - id: cargo-machete
- repo: https://github.com/DevinR528/cargo-sort
  rev: v2.1.3
  hooks:
  - id: cargo-sort
- repo: local
  hooks:
    - id: cargo-fmt
      name: cargo fmt
      entry: cargo fmt --manifest-path Cargo.toml
      language: system
      pass_filenames: false
    - id: cargo-check
      name: cargo check
      entry: cargo check --manifest-path Cargo.toml
      language: system
      pass_filenames: false
